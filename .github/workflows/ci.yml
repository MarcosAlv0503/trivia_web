name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  # En main no se cancela: cortaría un despliegue a medias.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build

  # Políticas RLS y RPC del juego probadas contra un Postgres real (pgTAP en supabase/tests).
  database:
    runs-on: ubuntu-latest
    env:
      # config.toml referencia estas variables; en CI basta con valores de relleno (solo arranca Postgres).
      SUPABASE_AUTH_EXTERNAL_GOOGLE_CLIENT_ID: ci
      SUPABASE_AUTH_EXTERNAL_GOOGLE_SECRET: ci
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec supabase db start
      - run: pnpm db:test

  # Producción: con todo en verde en main, aplica las migraciones nuevas y despliega la Edge Function.
  # No hace nada hasta que existan la variable y los secretos (docs/produccion.md > "Despliegue automático").
  deploy-supabase:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.SUPABASE_PROJECT_ID != ''
    needs: [check, database]
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
      SUPABASE_AUTH_EXTERNAL_GOOGLE_CLIENT_ID: ci
      SUPABASE_AUTH_EXTERNAL_GOOGLE_SECRET: ci
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Sin `supabase link`: pediría al token más permisos (leer las claves del proyecto) de los que hacen falta.
      - run: pnpm exec supabase db push --db-url "$SUPABASE_DB_URL" --yes
      - run: pnpm exec supabase functions deploy push --project-ref ${{ vars.SUPABASE_PROJECT_ID }}
